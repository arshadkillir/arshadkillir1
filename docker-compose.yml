services:
  db:
    container_name: pos-db
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    container_name: pos-backend
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: ${NODE_ENV}
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5 # Use npm start for a stable server process in Docker
    command: sh -c "npm install && npx prisma generate && npx prisma migrate dev --name init && npm run seed && npm run dev"
    restart: unless-stopped

  frontend:
    container_name: pos-frontend
    build:
      context: ./frontend
      target: builder
    volumes:
      - ./frontend:/app # Mount the source code
      - /app/node_modules # Use an anonymous volume to isolate node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend # This should be a list of service names
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped

  maildev:
    container_name: pos-maildev
    image: maildev/maildev
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP Server
    restart: unless-stopped

volumes:
  db-data: {} # Declare the named volume for the database
